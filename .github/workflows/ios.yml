name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run protocol tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name|startswith("iPhone"))][0].name')
          echo "simulator: $DEVICE"
          xcodebuild test \
            -project VocLock.xcodeproj \
            -scheme VocLock \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  build:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned ipa
        run: |
          xcodebuild \
            -project VocLock.xcodeproj \
            -scheme VocLock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VocLock.app Payload/
          zip -qr VocLock-unsigned.ipa Payload
          ls -lh VocLock-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VocLock-unsigned-ipa
          path: VocLock-unsigned.ipa
